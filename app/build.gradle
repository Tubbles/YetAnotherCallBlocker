apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'

android {
    compileSdkVersion 30
    defaultConfig {
        // YACB T installs alongside the original; the Java package stays
        // dummydomain.yetanothercallblocker, every package reference in the
        // code goes through BuildConfig.APPLICATION_ID or getPackageName().
        applicationId "com.tubbles.yacb"
        minSdkVersion 14
        targetSdkVersion 30
        // CI builds get a monotonically increasing versionCode (base * 1000 +
        // workflow run number) so every artifact can update the previous one.
        versionCode System.getenv("PINETIME_CI_VERSION_CODE") != null ? 5170 * 1000 + Integer.parseInt(System.getenv("PINETIME_CI_VERSION_CODE")) : 5170
        versionName "0.5.17"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [eventBusIndex: 'dummydomain.yetanothercallblocker.EventBusIndex']
            }
        }
    }
    signingConfigs {
        // CI debug signing with an explicit committed keystore, the same
        // arrangement as the other apps in pinetime-hacks: a fresh runner
        // would otherwise generate a throwaway key per build and Android
        // would refuse to update the previous install.
        if (System.getenv("PINETIME_DEBUG_KEYSTORE") != null) {
            ciDebug {
                storeFile file(System.getenv("PINETIME_DEBUG_KEYSTORE"))
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv("PINETIME_DEBUG_KEYSTORE") != null) {
                signingConfig signingConfigs.ciDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.resValue "string", "app_id", variant.applicationId
    }
    lintOptions {
        lintConfig file("lint.xml")
        abortOnError false
    }
}

greendao {
    schemaVersion 2
}

dependencies {
    def eventbus_version = '3.2.0'

    implementation 'org.slf4j:slf4j-api:1.7.32'
    runtimeOnly 'com.github.tony19:logback-android:2.0.0'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    //noinspection GradleDependency: 3.12.* is the latest version compatible with Android <5
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.gitlab.xynngh:LibPhoneNumberInfo:c77bdd2b69'
    implementation 'org.apache.commons:commons-csv:1.8'

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation 'androidx.paging:paging-runtime:2.1.2'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.work:work-runtime:2.6.0'
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation "org.greenrobot:eventbus:$eventbus_version"
    annotationProcessor "org.greenrobot:eventbus-annotation-processor:$eventbus_version"
}
